name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-15]
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: ruby -c bin/pre-commit && ruby -c lib/pre_commit.rb
      - run: ruby test/pre_commit_test.rb
      - if: matrix.os == 'ubuntu-24.04'
        run: ruby test/integration_test.rb
      - run: git diff --check
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: c8m6/empeira
          ref: 4c3185d3083f6defaa8a7c3908caa7615f1c34c7
          path: .compat-core
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        env:
          BUNDLER_VERSION: ${{ matrix.ruby == '4.0' && '4.0.22' || '2.6.9' }}
          BUNDLE_FROZEN: 'true'
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ matrix.ruby == '4.0' && '4.0.22' || '2.6.9' }}
          bundler-cache: true
          working-directory: .compat-core
      - name: Run the real addon through Core installation and execution
        working-directory: .compat-core
        env:
          BUNDLER_VERSION: ${{ matrix.ruby == '4.0' && '4.0.22' || '2.6.9' }}
          BUNDLE_FROZEN: 'true'
          EMPEIRA_OFFICIAL_ADDON_ROOT: ${{ github.workspace }}/..
          EMPEIRA_OFFICIAL_ADDONS: pre-commit
        run: bundle exec rspec spec/acceptance/official_addons.rb
