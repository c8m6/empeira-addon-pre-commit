# Scheduled version updates. Security updates are managed separately by GitHub.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "08:20"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    groups:
      routine-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
